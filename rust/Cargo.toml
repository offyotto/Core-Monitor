[workspace]
resolver = "2"
members = ["crates/core", "crates/sys", "crates/smc-helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/offyotto/Core-Monitor"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
core-monitor-core = { path = "crates/core" }
core-monitor-sys = { path = "crates/sys" }

[profile.release]
lto = true
codegen-units = 1
strip = true
