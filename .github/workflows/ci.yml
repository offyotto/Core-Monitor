name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    name: Build and Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Record toolchain versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Run macOS test suite
        run: |
          xcodebuild test \
            -project Core-Monitor.xcodeproj \
            -scheme Core-Monitor \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath build/ci/Core-Monitor.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Check optimized helper lifetime
        run: ./scripts/tests/check_helper_lifetime.sh

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-monitor-ci-results
          path: build/ci/Core-Monitor.xcresult
          if-no-files-found: warn
          retention-days: 7
