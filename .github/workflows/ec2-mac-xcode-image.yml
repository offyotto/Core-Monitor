name: EC2 Mac Xcode Image

# Builds a macOS image that already has Xcode, so "EC2 Mac Hardware Check" can
# run the full test suite. Upload an Apple-signed Xcode .xip to the private
# bucket's xcode/ folder first. When this finishes, set the repository variable
# EC2_MAC_AMI_ID to the image ID it prints.

on:
  workflow_dispatch:
    inputs:
      xcode_key:
        description: S3 key of the Xcode archive in the CI bucket
        required: true
        default: xcode/Xcode_26.6.xip

permissions:
  contents: read

concurrency:
  group: ec2-mac-hardware
  cancel-in-progress: false

jobs:
  xcode-image:
    name: Build Xcode image on mac-m4.metal
    runs-on: ubuntu-latest
    environment: ec2-mac
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      INSTANCE_TYPE: mac-m4.metal
      XCODE_KEY: ${{ github.event.inputs.xcode_key }}
      BUCKET: ${{ vars.EC2_MAC_BUCKET }}
      SECURITY_GROUP: ${{ vars.EC2_MAC_SECURITY_GROUP }}

    steps:
      - name: Validate archive key
        run: |
          if [[ ! "${XCODE_KEY}" =~ ^xcode/[A-Za-z0-9._-]+\.xip$ ]]; then
            echo "Archive key must look like xcode/Xcode_26.6.xip: ${XCODE_KEY}" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.EC2_MAC_ROLE_ARN }}
          aws-region: us-east-1
          # Outlasts the 300-minute job timeout so cleanup never runs with expired credentials.
          role-duration-seconds: 21600

      - name: Check the archive exists
        run: |
          aws s3api head-object --bucket "${BUCKET}" --key "${XCODE_KEY}" \
            --query '{size: ContentLength, modified: LastModified}' --output table

      - name: Find or allocate a Dedicated Host
        id: host
        run: |
          HOST_ID=$(aws ec2 describe-hosts \
            --filter "Name=tag:Project,Values=core-monitor-ci" "Name=instance-type,Values=${INSTANCE_TYPE}" "Name=state,Values=available" \
            --query 'Hosts[?!Instances] | [0].HostId' --output text)

          # After each run AWS wipes the host, which shows as "pending". Waiting for
          # it is cheaper than renting a second host for another 24 hours.
          if [[ "${HOST_ID}" == "None" || -z "${HOST_ID}" ]]; then
            WIPING_ID=$(aws ec2 describe-hosts \
              --filter "Name=tag:Project,Values=core-monitor-ci" "Name=instance-type,Values=${INSTANCE_TYPE}" "Name=state,Values=pending" \
              --query 'Hosts[?!Instances] | [0].HostId' --output text)
            if [[ "${WIPING_ID}" != "None" && -n "${WIPING_ID}" ]]; then
              echo "Waiting up to 45 minutes for ${WIPING_ID} to finish its wipe."
              for _ in $(seq 1 90); do
                if [[ "$(aws ec2 describe-hosts --host-ids "${WIPING_ID}" --query 'Hosts[0].State' --output text)" == "available" ]]; then
                  HOST_ID="${WIPING_ID}"
                  break
                fi
                sleep 30
              done
            fi
          fi

          if [[ "${HOST_ID}" == "None" || -z "${HOST_ID}" ]]; then
            for AZ in us-east-1a us-east-1b us-east-1c us-east-1d; do
              if HOST_ID=$(aws ec2 allocate-hosts \
                  --instance-type "${INSTANCE_TYPE}" --availability-zone "${AZ}" --quantity 1 \
                  --tag-specifications 'ResourceType=dedicated-host,Tags=[{Key=Project,Value=core-monitor-ci}]' \
                  --query 'HostIds[0]' --output text); then
                echo "Allocated ${HOST_ID} in ${AZ}"
                break
              fi
              HOST_ID=""
            done
          else
            echo "Reusing ${HOST_ID}"
          fi

          if [[ -z "${HOST_ID}" ]]; then
            echo "No ${INSTANCE_TYPE} host capacity in us-east-1a to 1d." >&2
            exit 1
          fi

          AZ=$(aws ec2 describe-hosts --host-ids "${HOST_ID}" --query 'Hosts[0].AvailabilityZone' --output text)
          echo "id=${HOST_ID}" >> "${GITHUB_OUTPUT}"
          echo "az=${AZ}" >> "${GITHUB_OUTPUT}"

      - name: Launch macOS instance from the AWS base image
        id: instance
        env:
          HOST_ID: ${{ steps.host.outputs.id }}
          HOST_AZ: ${{ steps.host.outputs.az }}
        run: |
          AMI_ID=$(aws ssm get-parameter --name /aws/service/ec2-macos/tahoe/arm64_mac/latest/image_id --query Parameter.Value --output text)
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=availability-zone,Values=${HOST_AZ}" "Name=default-for-az,Values=true" \
            --query 'Subnets[0].SubnetId' --output text)

          INSTANCE_ID=$(aws ec2 run-instances \
            --instance-type "${INSTANCE_TYPE}" \
            --placement "Tenancy=host,HostId=${HOST_ID}" \
            --image-id "${AMI_ID}" \
            --subnet-id "${SUBNET_ID}" \
            --security-group-ids "${SECURITY_GROUP}" \
            --iam-instance-profile Name=core-monitor-ec2-mac-instance \
            --metadata-options HttpTokens=required \
            --block-device-mappings 'DeviceName=/dev/sda1,Ebs={VolumeSize=200,VolumeType=gp3,DeleteOnTermination=true}' \
            --tag-specifications \
              'ResourceType=instance,Tags=[{Key=Project,Value=core-monitor-ci},{Key=Name,Value=core-monitor-xcode-image}]' \
              'ResourceType=volume,Tags=[{Key=Project,Value=core-monitor-ci}]' \
            --query 'Instances[0].InstanceId' --output text)

          echo "Launched ${INSTANCE_ID} from ${AMI_ID}"
          echo "id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Systems Manager
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          for _ in $(seq 1 90); do
            PING=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            if [[ "${PING}" == "Online" ]]; then
              echo "Instance is online in Systems Manager."
              exit 0
            fi
            sleep 30
          done
          echo "Instance did not come online in Systems Manager within 45 minutes." >&2
          exit 1

      - name: Install Xcode
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          PARAMS=$(jq -n \
            --arg uri "s3://${BUCKET}/${XCODE_KEY}" \
            '{commands: [
              "set -e",
              "export HOME=/var/root",
              "export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH",
              "rm -rf /tmp/core-monitor",
              "git clone --quiet --depth 1 https://github.com/offyotto/Core-Monitor.git /tmp/core-monitor",
              ("bash /tmp/core-monitor/scripts/ci/ec2_mac_install_xcode.sh " + $uri)
            ], executionTimeout: ["5400"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          # 300 polls of 20 seconds covers the 90-minute command timeout.
          STATUS=Pending
          API_ERRORS=0
          for _ in $(seq 1 300); do
            [[ "${STATUS}" =~ ^(Pending|InProgress|Delayed)$ ]] || break
            sleep 20
            if NEXT=$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
                --query Status --output text); then
              STATUS="${NEXT}"
              API_ERRORS=0
            elif (( ++API_ERRORS >= 5 )); then
              echo "Systems Manager API failed 5 times in a row." >&2
              exit 1
            fi
          done

          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Command status: ${STATUS}"
          [[ "${STATUS}" == "Success" ]]

      - name: Save the image
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          NAME="core-monitor-$(basename "${XCODE_KEY}" .xip | tr '[:upper:]_' '[:lower:]-')-${{ github.run_id }}"
          IMAGE_ID=$(aws ec2 create-image \
            --instance-id "${INSTANCE_ID}" \
            --name "${NAME}" \
            --description "EC2 macOS with ${XCODE_KEY} for Core-Monitor CI" \
            --tag-specifications \
              'ResourceType=image,Tags=[{Key=Project,Value=core-monitor-ci}]' \
              'ResourceType=snapshot,Tags=[{Key=Project,Value=core-monitor-ci}]' \
            --query ImageId --output text)
          echo "Creating ${IMAGE_ID} (${NAME})"

          for _ in $(seq 1 240); do
            STATE=$(aws ec2 describe-images --image-ids "${IMAGE_ID}" --query 'Images[0].State' --output text)
            case "${STATE}" in
              available)
                echo "Image ${IMAGE_ID} is ready."
                echo "Set it as the hardware check image with:"
                echo "  gh variable set EC2_MAC_AMI_ID --body ${IMAGE_ID}"
                echo "### Image ready: \`${IMAGE_ID}\`" >> "${GITHUB_STEP_SUMMARY}"
                exit 0
                ;;
              failed|invalid|error|deregistered)
                echo "Image ${IMAGE_ID} ended in state ${STATE}." >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Image ${IMAGE_ID} was not ready after 2 hours." >&2
          exit 1

      - name: Refresh AWS credentials for cleanup
        if: always() && steps.instance.outputs.id != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.EC2_MAC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terminate instance
        if: always() && steps.instance.outputs.id != ''
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          aws ec2 terminate-instances --instance-ids "${INSTANCE_ID}" --query 'TerminatingInstances[0].CurrentState.Name' --output text
          echo "The host stays allocated for reuse. EC2 Mac Host Cleanup releases it after 24 hours."
